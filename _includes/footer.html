<footer class="site-footer">
  <div class="wrapper">
    <p>&copy; {{ site.copyright | default: site.title | escape }} <time id="copyright-date" datetime="{{ 'now' | date: '%Y-%m' }}">{{ 'now' | date: '%B %Y' }}</time> · <a href="{{ '/privacy/' | relative_url }}">Privacy</a></p>
  </div>
</footer>
<script>
  (() => {
    const date = new Date();
    const copyrightDate = document.getElementById('copyright-date');
    copyrightDate.dateTime = String(date.getFullYear()) + '-' + String(date.getMonth() + 1).padStart(2, '0');
    copyrightDate.textContent = date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  })();
</script>
