<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    {%- if jekyll.environment == 'production' and site.portfolio_visit_tracking -%}
      <script defer src="{{ '/assets/js/portfolio-visits.js' | relative_url }}"></script>
    {%- endif -%}
  </body>

</html>
