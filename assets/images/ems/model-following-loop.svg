<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540" role="img" aria-labelledby="title desc">
  <title id="title">The model-following loop</title>
  <desc id="desc">The author writes and notes are saved locally. A pause creates a revision-tagged snapshot for the Rust backend and local model. A validated proposal returns to a quiet preview. The author decides whether to apply it. New edits cancel old work.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#888c95" stroke-width="1.5"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#e7e8eb;font-size:20px}.sub{font-size:15px;fill:#a8adb8}.label{font-size:14px;fill:#a8adb8}.box{fill:#24272e;stroke:#454b58;stroke-width:1}.line{fill:none;stroke:#888c95;stroke-width:1.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1080" height="540" rx="16" fill="#181b20"/>
  <text x="40" y="48" style="font-size:23px">Writing stays in front. Following stays underneath.</text>
  <rect x="40" y="105" width="210" height="100" rx="10" class="box"/><text x="62" y="143">Write in Notes</text><text x="62" y="173" class="sub">Local text, tables, caret</text>
  <rect x="310" y="105" width="210" height="100" rx="10" class="box"/><text x="332" y="143">Pause → snapshot</text><text x="332" y="173" class="sub">Note ID + revision</text>
  <rect x="580" y="105" width="210" height="100" rx="10" class="box"/><text x="602" y="143">Rust backend</text><text x="602" y="173" class="sub">Budget, route, cancel</text>
  <rect x="850" y="105" width="190" height="100" rx="10" class="box"/><text x="872" y="143">Local model</text><text x="872" y="173" class="sub">Structured proposal</text>
  <path d="M250 155H300M520 155H570M790 155H840" class="line"/>
  <path d="M945 205V297H790" class="line"/>
  <rect x="580" y="250" width="210" height="100" rx="10" class="box"/><text x="602" y="288">Check the result</text><text x="602" y="318" class="sub">Schema + exact source</text>
  <rect x="310" y="250" width="210" height="100" rx="10" class="box"/><text x="332" y="288">Quiet preview</text><text x="332" y="318" class="sub">Inspect or dismiss</text>
  <rect x="40" y="250" width="210" height="100" rx="10" fill="#203548" stroke="#5189b7"/><text x="62" y="288">You choose Apply</text><text x="62" y="318" class="sub">Editable and undoable</text>
  <path d="M580 300H530M310 300H260" class="line"/><path d="M145 250V215" class="line"/>
  <path d="M415 205V405H945V216" fill="none" stroke="#757c88" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="442" y="433" class="label">New edit → cancel old work and discard stale replies</text>
  <text x="40" y="495" class="sub">V1: bounded snapshots and reviewed edits. MCP research and persistent model memory come later.</text>
</svg>
