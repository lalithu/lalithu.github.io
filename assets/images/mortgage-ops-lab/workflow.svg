<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 376" role="img" aria-label="One loan, from application to sale"><rect width="720" height="376" rx="20" fill="#111323"/><text x="30" y="38" fill="#eae7ff" font-family="system-ui,sans-serif" font-size="23" font-weight="700">One loan, from application to sale</text><rect x="28" y="58" width="664" height="78" rx="12" fill="#22203d" stroke="#665cce"/><text x="48" y="87" fill="#eae7ff" font-family="system-ui,sans-serif" font-size="22" font-weight="700">1. CRM → Application</text><text x="48" y="114" fill="#cac4f1" font-family="system-ui,sans-serif" font-size="18">Start a loan record linked to the borrower.</text><path d="M360 137v20m-6-6 6 6 6-6" stroke="#aea6f7" stroke-width="2" fill="none"/><rect x="28" y="160" width="664" height="78" rx="12" fill="#22203d" stroke="#665cce"/><text x="48" y="189" fill="#eae7ff" font-family="system-ui,sans-serif" font-size="22" font-weight="700">2. Processing → Underwriting → Approved</text><text x="48" y="216" fill="#cac4f1" font-family="system-ui,sans-serif" font-size="18">Verify required documents before underwriting.</text><path d="M360 239v20m-6-6 6 6 6-6" stroke="#aea6f7" stroke-width="2" fill="none"/><rect x="28" y="262" width="664" height="78" rx="12" fill="#22203d" stroke="#665cce"/><text x="48" y="291" fill="#eae7ff" font-family="system-ui,sans-serif" font-size="22" font-weight="700">3. Funded → Listed → Sold</text><text x="48" y="318" fill="#cac4f1" font-family="system-ui,sans-serif" font-size="18">Compare eligible offers and record the simulated sale.</text></svg>
