<text x="100" y="134" text-anchor="start" class="label">01</text>
<text x="144" y="134" text-anchor="start" class="strong">Creator recommendation</text>
<text x="144" y="161" text-anchor="start" class="label">A local experience worth sharing</text>
<path class="line" d="M300 180 L300 201"/>
<rect x="72" y="202" width="456" height="78" rx="9" fill="#fff" stroke="#b8c8be"/>
