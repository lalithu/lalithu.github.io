<text x="144" y="434" text-anchor="start" class="strong">Verified transaction</text>
<text x="144" y="461" text-anchor="start" class="label">Confirm an opt-in redemption</text>
<path class="line" d="M300 480 L300 501"/>
<rect x="72" y="502" width="456" height="78" rx="9" fill="#e9f0eb" stroke="#b8c8be"/>
<text x="100" y="534" text-anchor="start" class="label">05</text>
<text x="144" y="534" text-anchor="start" class="strong">Repeat customer</text>
<text x="144" y="561" text-anchor="start" class="label">Observe a return visit</text>
<path class="line" d="M528 541 H564 V141 H530"/>
