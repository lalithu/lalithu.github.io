<text x="144" y="234" text-anchor="start" class="strong">Consumer discovery</text>
<text x="144" y="261" text-anchor="start" class="label">Find a relevant place or offer</text>
<path class="line" d="M300 280 L300 301"/>
<rect x="72" y="302" width="456" height="78" rx="9" fill="#fff" stroke="#b8c8be"/>
<text x="100" y="334" text-anchor="start" class="label">03</text>
<text x="144" y="334" text-anchor="start" class="strong">Purchase or booking</text>
<text x="144" y="361" text-anchor="start" class="label">Choose a measurable action</text>
<path class="line" d="M300 380 L300 401"/>
<rect x="72" y="402" width="456" height="78" rx="9" fill="#fff" stroke="#b8c8be"/>
