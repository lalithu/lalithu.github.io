<svg xmlns="http://www.w3.org/2000/svg" width="600" height="610" viewBox="0 0 600 610" role="img" aria-labelledby="title desc"><title id="title">Make quiet periods measurable</title><desc id="desc">Merchant-controlled promotion tied to verified purchase data. Choose the quiet period: Example: café offer, 2–5 PM; Approve a creator and the offer: Set discount, contribution floor, and redemption cap; Creator shares with local followers: Use a time-limited link, QR, or code; Match paid redemptions: Track sale amount, time, creator, and refunds; Learn before repeating the discount: Compare margin and incremental impact. More revenue alone does not establish additional profit.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bf2f77"/></marker></defs><rect width="600" height="610" rx="12" fill="#f7f5f3"/><g font-family="Arial,Helvetica,sans-serif" fill="#2a2429"><text x="30" y="36" font-size="15" fill="#bf2f77" letter-spacing="1.6">PROPOSED WORKFLOW</text><text x="30" y="74" font-size="27" font-weight="600">Make quiet periods measurable</text><rect x="45" y="100" width="510" height="66" rx="8" fill="#fff" stroke="#e3d8de"/><text x="65" y="129" font-size="21" font-weight="600">Choose the quiet period</text><text x="65" y="152" font-size="17" fill="#80717a">Example: café offer, 2–5 PM</text><path d="M300 166V185" stroke="#bf2f77" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="188" width="510" height="66" rx="8" fill="#fff" stroke="#e3d8de"/><text x="65" y="217" font-size="21" font-weight="600">Approve a creator and the offer</text><text x="65" y="240" font-size="17" fill="#80717a">Set discount, contribution floor, and redemption cap</text><path d="M300 254V273" stroke="#bf2f77" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="276" width="510" height="66" rx="8" fill="#fff" stroke="#e3d8de"/><text x="65" y="305" font-size="21" font-weight="600">Creator shares with local followers</text><text x="65" y="328" font-size="17" fill="#80717a">Use a time-limited link, QR, or code</text><path d="M300 342V361" stroke="#bf2f77" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="364" width="510" height="66" rx="8" fill="#fff" stroke="#e3d8de"/><text x="65" y="393" font-size="21" font-weight="600">Match paid redemptions</text><text x="65" y="416" font-size="17" fill="#80717a">Track sale amount, time, creator, and refunds</text><path d="M300 430V449" stroke="#bf2f77" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="452" width="510" height="66" rx="8" fill="#fff0f6" stroke="#e3d8de"/><text x="65" y="481" font-size="21" font-weight="600">Learn before repeating the discount</text><text x="65" y="504" font-size="17" fill="#80717a">Compare margin and incremental impact</text><text x="300" y="582" text-anchor="middle" font-size="16" fill="#887580">More revenue alone does not establish additional profit.</text></g></svg>