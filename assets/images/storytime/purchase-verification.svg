<svg xmlns="http://www.w3.org/2000/svg" width="600" height="610" viewBox="0 0 600 610" role="img" aria-labelledby="title desc"><title id="title">Follow the customer purchase</title><desc id="desc">Observe only explicit engagement; match the code and transaction. Creator shares an approved offer: Link, QR, or creator code; Follower opens the offer: First observed engagement; passive views stay unknown; Customer redeems at the business: Campaign + creator code attached to the order; POS confirms payment: Match transaction ID, amount, time, and refund status; Merchant sees the connection: Engagement → offer → paid purchase. Code-only purchases do not prove an earlier engagement.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bf2f77"/></marker></defs><rect width="600" height="610" rx="12" fill="#f7f5f3"/><g font-family="Arial,Helvetica,sans-serif" fill="#2a2429"><text x="30" y="36" font-size="15" fill="#bf2f77" letter-spacing="1.6">PROPOSED WORKFLOW</text><text x="30" y="74" font-size="27" font-weight="600">Follow the customer purchase</text><rect x="45" y="100" width="510" height="66" rx="8" fill="#fff" stroke="#e3d8de"/><text x="65" y="129" font-size="21" font-weight="600">Creator shares an approved offer</text><text x="65" y="152" font-size="17" fill="#80717a">Link, QR, or creator code</text><path d="M300 166V185" stroke="#bf2f77" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="188" width="510" height="66" rx="8" fill="#fff" stroke="#e3d8de"/><text x="65" y="217" font-size="21" font-weight="600">Follower opens the offer</text><text x="65" y="240" font-size="17" fill="#80717a">First observed engagement; passive views stay unknown</text><path d="M300 254V273" stroke="#bf2f77" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="276" width="510" height="66" rx="8" fill="#fff" stroke="#e3d8de"/><text x="65" y="305" font-size="21" font-weight="600">Customer redeems at the business</text><text x="65" y="328" font-size="17" fill="#80717a">Campaign + creator code attached to the order</text><path d="M300 342V361" stroke="#bf2f77" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="364" width="510" height="66" rx="8" fill="#fff" stroke="#e3d8de"/><text x="65" y="393" font-size="21" font-weight="600">POS confirms payment</text><text x="65" y="416" font-size="17" fill="#80717a">Match transaction ID, amount, time, and refund status</text><path d="M300 430V449" stroke="#bf2f77" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="452" width="510" height="66" rx="8" fill="#fff0f6" stroke="#e3d8de"/><text x="65" y="481" font-size="21" font-weight="600">Merchant sees the connection</text><text x="65" y="504" font-size="17" fill="#80717a">Engagement → offer → paid purchase</text><text x="300" y="582" text-anchor="middle" font-size="16" fill="#887580">Code-only purchases do not prove an earlier engagement.</text></g></svg>